name: Build Packages

# 触发方式：
#   1. push tag         → 只构建「精选常用架构」（DEFAULT_ARCHES），避免 32×2=64 个 job 烧额度
#   2. 手动 Run workflow → 自己选架构 + 版本，可单架构、精选、或全量
#
# 架构清单是唯一数据源，在下方 prepare job 的 Python 里定义。
# 手动输入不存在的架构名会直接报错并列出全部合法值，不用翻代码查。

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构。留空=精选常用架构(9个)；填 all=全部 32 个；也可填单个，如 x86_64 / aarch64_cortex-a53'
        required: false
        default: ''
      tag:
        description: 'OpenWrt 版本'
        required: true
        type: choice
        default: openwrt-24.10
        options:
          - openwrt-24.10
          - openwrt-25.12
          - all
      release_tag:
        description: '发布到指定 Release 标签。留空=只构建产物并上传为 Actions artifact，不创建 Release'
        required: false
        default: ''

jobs:
  # ─────────────────────────────────────────────────────────────
  # prepare：算出构建矩阵。
  # 把「架构别名映射」和「无效组合剔除」都放在这里，是为了让 build job 干净——
  # 无效组合根本不会启动 runner，而不是启动了再 if 掉（旧写法会白烧 runner 时间）。
  # ─────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      release_tag: ${{ steps.gen.outputs.release_tag }}
    steps:
      - name: 生成构建矩阵
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          # 全部架构（openwrt-24.10 下可用）
          ALL_ARCHES = [
              "aarch64_cortex-a53",
              "aarch64_cortex-a72",
              "aarch64_cortex-a76",
              "aarch64_generic",
              "arm_arm1176jzf-s_vfp",
              "arm_arm926ej-s",
              "arm_cortex-a15_neon-vfpv4",
              "arm_cortex-a5_vfpv4",
              "arm_cortex-a7",
              "arm_cortex-a7_neon-vfpv4",
              "arm_cortex-a7_vfpv4",
              "arm_cortex-a8_vfpv3",
              "arm_cortex-a9",
              "arm_cortex-a9_neon",
              "arm_cortex-a9_vfpv3-d16",
              "arm_fa526",
              "arm_xscale",
              "i386_pentium-mmx",
              "i386_pentium4",
              "loongarch64_generic",
              "mips64_mips64r2",
              "mips64_octeonplus",
              "mips64el_mips64r2",
              "mips_24kc",
              "mips_4kec",
              "mips_mips32",
              "mipsel_24kc",
              "mipsel_24kc_24kf",
              "mipsel_74kc",
              "mipsel_mips32",
              "riscv64_riscv64",
              "x86_64",
          ]

          # 精选常用架构：push tag 时只跑这些（9 个 × 2 版本 = 18 job）
          DEFAULT_ARCHES = [
              "x86_64",                 # x86 软路由
              "aarch64_cortex-a53",     # N1 / 树莓派 3B+ / 大量 ARM 路由
              "aarch64_cortex-a72",     # 树莓派 4
              "aarch64_generic",        # 通用 ARM64
              "arm_cortex-a7_neon-vfpv4",
              "arm_cortex-a9_neon",
              "mipsel_24kc",            # MT7621 等主流 MIPS
              "mips_24kc",              # ath79
              "riscv64_riscv64",
          ]

          TAGS = ["openwrt-24.10", "openwrt-25.12"]

          # 某些版本下架构改名了，需要映射到实际 SDK 架构名
          ARCH_ALIAS = {
              ("openwrt-25.12", "riscv64_riscv64"): "riscv64_generic",
          }

          # 某些版本下架构已不存在，直接剔除（不再启动 runner 空跑）
          SKIP = {
              ("openwrt-25.12", "mips_4kec"),
          }

          event = os.environ.get("EVENT_NAME", "")
          ref = os.environ.get("REF_NAME", "")
          arch_in = (os.environ.get("INPUT_ARCH") or "").strip()
          tag_in = (os.environ.get("INPUT_TAG") or "").strip()
          release_in = (os.environ.get("INPUT_RELEASE_TAG") or "").strip()

          if event == "workflow_dispatch":
              # 架构：空 → 精选；all → 全部；其他 → 单个（需精确匹配）
              if arch_in and arch_in != "all":
                  if arch_in not in ALL_ARCHES:
                      sys.exit(
                          "未知架构: %s\n可选值:\n  all\n  %s"
                          % (arch_in, "\n  ".join(ALL_ARCHES))
                      )
                  arches = [arch_in]
              elif arch_in == "all":
                  arches = ALL_ARCHES
              else:
                  arches = DEFAULT_ARCHES

              tags = [tag_in] if tag_in in TAGS else TAGS
              # 手动运行：release_tag 留空 → 只出 artifact，不碰 Release
              release_tag = release_in
          else:
              # push tag：跑精选架构，发布到当前 tag
              arches = DEFAULT_ARCHES
              tags = TAGS
              release_tag = ref

          include = []
          for a in arches:
              for t in tags:
                  if (t, a) in SKIP:
                      continue
                  eff = ARCH_ALIAS.get((t, a), a)
                  include.append(
                      {
                          "arch": a,
                          "effective_arch": eff,
                          "tag": t,
                          "pkg_arch": "%s-%s" % (eff, t),
                      }
                  )

          if not include:
              sys.exit(
                  "构建矩阵为空：所选架构/版本组合全部被跳过，请换一个组合。"
              )

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write("matrix=%s\n" % json.dumps({"include": include}, separators=(",", ":")))
              f.write("release_tag=%s\n" % release_tag)

          print("共 %d 个构建任务：" % len(include))
          for i in include:
              print("  - %s" % i["pkg_arch"])
          print("发布目标：%s" % (release_tag or "(不发布，仅上传 artifact)"))
          PYEOF

  build:
    needs: prepare
    name: Build ${{ matrix.pkg_arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 构建前准备
        run: |
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' mosdns/Makefile
          sed -i '/golang-package/a \\tGO_PKG_DEFAULT_LDFLAGS:=-w -s -extldflags "-static"' geo2txt/Makefile
          git clone https://github.com/sbwml/v2ray-geodata

      - name: 编译软件包
        uses: sbwml/openwrt-gh-action-sdk@go1.27
        env:
          FEEDNAME: packages_ci
          PACKAGES: luci-app-mosdns
          NO_REFRESH_CHECK: true

      # continue-on-error：个别架构可能没有产物，不让整个 matrix 变红。
      - name: 打包
        continue-on-error: true
        run: |
          tar -zcvf ${{ matrix.pkg_arch }}.tar.gz -C bin/packages/${{ matrix.effective_arch }}/ packages_ci

      - name: 上传到 Release
        if: needs.prepare.outputs.release_tag != ''
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.prepare.outputs.release_tag }}
          tag: ${{ needs.prepare.outputs.release_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          artifacts: "${{ matrix.pkg_arch }}.tar.gz"

      - name: 上传为 Actions 产物（不发布时）
        if: needs.prepare.outputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg_arch }}
          path: ${{ matrix.pkg_arch }}.tar.gz
          if-no-files-found: warn
          retention-days: 14
